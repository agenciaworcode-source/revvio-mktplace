# Raspadores sociais — os que montam a prévia de um link e NÃO executam
# JavaScript. Como o site é uma SPA, sem isto todo link compartilhado mostra o
# título e a imagem genéricos da home, seja qual for a rota.
#
# Buscador NÃO entra nesta lista, de propósito: Googlebot e Bingbot renderizam
# JS e já leem as meta tags que o <Seo> injeta. Mandar HTML diferente para eles
# seria cloaking sem ganho nenhum.
#
# Este arquivo é incluído dentro do bloco `http` (vai para conf.d/), então o
# `map` aqui no topo é válido — `map` não pode ficar dentro de `server`.
map $http_user_agent $raspador_social {
  default                                      0;
  "~*(facebookexternalhit|facebookcatalog)"    1;
  "~*Facebot"                                  1;
  "~*WhatsApp"                                 1;
  "~*Twitterbot"                               1;
  "~*LinkedInBot"                              1;
  "~*(Slackbot|Slack-ImgProxy)"                1;
  "~*TelegramBot"                              1;
  "~*Discordbot"                               1;
  "~*Pinterest"                                1;
  "~*SkypeUriPreview"                          1;
  "~*redditbot"                                1;
  "~*vkShare"                                  1;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Necessário porque o proxy_pass abaixo monta a URL com variável: nesse caso
  # o nginx resolve o host em tempo de execução, e sem resolver ele nem sobe.
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

  # assets com hash no nome podem ser cacheados agressivamente
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Arquivo existente é servido direto; o resto cai no @spa, que decide entre a
  # prévia dos raspadores e o index.html de sempre.
  location / {
    try_files $uri $uri/ @spa;
  }

  location @spa {
    # Só raspador social é desviado. Todo o resto — pessoas e buscadores —
    # segue para o index.html, exatamente como antes.
    if ($raspador_social) {
      proxy_pass https://ahtisetxygjyfvhguckl.functions.supabase.co/seo-prerender$request_uri;
    }
    try_files /index.html =404;
  }

  # A function exige SNI, e o Host tem que ser o dela, não o do site.
  proxy_ssl_server_name on;
  proxy_set_header Host ahtisetxygjyfvhguckl.functions.supabase.co;
  # Prévia é melhor-esforço: se a function demorar, não vale segurar a conexão.
  proxy_connect_timeout 5s;
  proxy_read_timeout 10s;

  # index.html nunca deve ser cacheado (aponta para os bundles novos)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
